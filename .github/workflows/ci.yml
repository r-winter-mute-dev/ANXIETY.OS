name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Derselbe Build wie auf GitHub Pages (Unterpfad), inkl. Offline-Test
      - name: E2E unter dem Pages-Unterpfad
        run: npm run test:e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
