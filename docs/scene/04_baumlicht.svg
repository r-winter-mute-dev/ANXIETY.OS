<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-label="Soft mauve light leaking through crystal tree cracks">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#313244"/><stop offset="1" stop-color="#11111b"/>
  </linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5c2e7"/><stop offset=".5" stop-color="#cba6f7"/><stop offset="1" stop-color="#b4befe"/>
  </linearGradient>
  <linearGradient id="warmstone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#45465c"/><stop offset="1" stop-color="#242436"/>
  </linearGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g id="tree-light" filter="url(#softGlow)" opacity=".9">
  <path d="M596 300 Q610 340 608 380 M525 360 Q550 380 560 405 M690 345 Q675 370 670 395
           M605 455 Q620 475 620 505 M585 565 Q600 590 600 620"
        fill="none" stroke="#cba6f7" stroke-width="10" stroke-linecap="round"/>
  <g fill="#f5c2e7">
    <circle cx="608" cy="345" r="8"/><circle cx="553" cy="390" r="6"/>
    <circle cx="675" cy="375" r="7"/><circle cx="620" cy="485" r="6"/>
  </g>
</g>
</svg>